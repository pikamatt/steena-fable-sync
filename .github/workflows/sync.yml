name: Sync Steena's Fable Reading History

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Steena's Fable reading history
        run: python sync_fable.py

      - name: Commit updated reading history
        run: |
          git config user.name "fable-sync"
          git config user.email "fable-sync@users.noreply.github.com"
          git add steena-reading-history.json
          git diff --cached --quiet || git commit -m "Update Steena's Fable reading history"
          git push
